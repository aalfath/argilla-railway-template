# Local test only (Daytona). Mirrors the Railway template's services and variables.
services:
  elasticsearch:
    build: ./elasticsearch
    environment:
      ELASTIC_PASSWORD: testpw0elastic0abcdefghijklmnop12
      PORT: "9200"
    volumes: [esdata:/usr/share/elasticsearch/data]
  postgres:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: pgtestpw, POSTGRES_DB: railway}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: redis-server --requirepass redistestpw
  argilla:
    build: ./argilla
    ports: ["6900:6900"]
    environment: &argilla
      PORT: "6900"
      USERNAME: admin
      PASSWORD: testpw0argilla0abcdefgh
      API_KEY: testapikey0abcdefghijklmnopqrstuvwxyz0123
      ARGILLA_AUTH_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ARGILLA_DATABASE_URL: postgresql://postgres:pgtestpw@postgres:5432/railway
      ARGILLA_REDIS_URL: redis://default:redistestpw@redis:6379
      ARGILLA_ELASTICSEARCH: http://elastic:testpw0elastic0abcdefghijklmnop12@elasticsearch:9200
  worker:
    build: ./worker
    environment:
      ARGILLA_DATABASE_URL: postgresql://postgres:pgtestpw@postgres:5432/railway
      ARGILLA_REDIS_URL: redis://default:redistestpw@redis:6379
      ARGILLA_ELASTICSEARCH: http://elastic:testpw0elastic0abcdefghijklmnop12@elasticsearch:9200
volumes: {esdata: {}, pgdata: {}}
